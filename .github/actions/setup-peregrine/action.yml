name: setup-peregrine
description: Install Peregrine dependencies and the selected pinned provider CLI.

inputs:
  runner:
    description: Review runner to prepare (claude or codex)
    required: false
    default: claude
  install-runner:
    description: Install ripgrep and the provider CLI; disable in the posting job
    required: false
    default: "true"
  bot-path:
    description: Path containing the checked-out Peregrine repository
    required: false
    default: peregrine

runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: ${{ inputs.bot-path }}/.nvmrc

    - name: Install bot dependencies
      shell: bash
      working-directory: ${{ inputs.bot-path }}
      run: npm ci

    - name: Install review prerequisites
      if: inputs.install-runner == 'true'
      shell: bash
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q ripgrep

    - name: Install pinned Claude Code CLI
      if: inputs.install-runner == 'true' && inputs.runner == 'claude'
      shell: bash
      run: npm install --global '@anthropic-ai/claude-code@2.1.252'

    - name: Install pinned Codex CLI
      if: inputs.install-runner == 'true' && inputs.runner == 'codex'
      shell: bash
      run: npm install --global '@openai/codex@0.152.0'

    - name: Reject unsupported runner
      if: inputs.install-runner == 'true' && inputs.runner != 'claude' && inputs.runner != 'codex'
      shell: bash
      run: |
        echo "Unsupported Peregrine runner: ${{ inputs.runner }}" >&2
        exit 1
