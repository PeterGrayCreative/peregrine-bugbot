# CI for the bot itself: typecheck + the zero-cost mock pipeline as a golden
# smoke test. The bot that reviews other repos should never itself be broken
# silently.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Mock pipeline smoke (matrix -> grade -> report)
        run: |
          npx tsx src/index.ts matrix --config eval/matrix.smoke.json
          RUNS_DIR=$(ls -d eval/runs/* | tail -1)
          JUDGE=exact npx tsx src/index.ts grade --runs "$RUNS_DIR"
          npx tsx src/index.ts report --runs "$RUNS_DIR"
          node -e "
            const { readFileSync } = require('node:fs');
            const stats = JSON.parse(readFileSync(process.argv[1] + '/benchmark.json', 'utf8'));
            const mock = stats.find((s) => s.config === 'mock');
            if (!mock || mock.recallMean !== 1 || mock.fpPerCaseMean !== 0) {
              console.error('mock benchmark regression:', JSON.stringify(mock));
              process.exit(1);
            }
            console.log('mock benchmark OK: recall 100%, 0 FP');
          " "$RUNS_DIR"
