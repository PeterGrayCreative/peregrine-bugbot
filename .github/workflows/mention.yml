# On-demand deep review: comment "@peregrine-bugbot" on a PR.
# Gated to repo members so outsiders can't burn the API budget. Note the gate
# covers the COMMENTER; the PR author (and thus title/body/diff) can be anyone,
# so all PR content stays treated as untrusted data:
#  - title/body are read from the PR JSON inside the run step (env assignment,
#    never GITHUB_OUTPUT heredocs — a body containing a delimiter line could
#    otherwise inject output values)
#  - the engine fences them as data in the prompt
name: peregrine-mention

on:
  issue_comment:
    types: [created]

env:
  PEREGRINE_RUNNER: ${{ vars.PEREGRINE_RUNNER || 'claude' }}

jobs:
  deep-review:
    if: >
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@peregrine-bugbot') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      head_sha: ${{ steps.pr.outputs.head_sha }}
      base_ref: ${{ steps.pr.outputs.base_ref }}
    steps:
      - name: Resolve PR refs
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/pulls/${{ github.event.issue.number }}" > "$RUNNER_TEMP/pr.json"
          # head SHA is hex and base ref is a git refname — neither can contain
          # newlines, so single-line outputs are injection-safe.
          echo "head_sha=$(jq -r .head.sha "$RUNNER_TEMP/pr.json")" >> "$GITHUB_OUTPUT"
          echo "base_ref=$(jq -r .base.ref "$RUNNER_TEMP/pr.json")" >> "$GITHUB_OUTPUT"

      - name: Checkout the immutable PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0
          path: target

      - name: Checkout Peregrine
        uses: actions/checkout@v4
        with:
          repository: PeterGrayCreative/peregrine-bugbot
          path: peregrine
          token: ${{ secrets.PEREGRINE_CHECKOUT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup selected runner
        uses: ./peregrine/.github/actions/setup-peregrine
        with:
          runner: ${{ env.PEREGRINE_RUNNER }}

      - name: Generate the review diff outside both checkouts
        run: |
          git -C target fetch -q origin '${{ steps.pr.outputs.base_ref }}'
          git -C target diff 'origin/${{ steps.pr.outputs.base_ref }}...${{ steps.pr.outputs.head_sha }}' > "$RUNNER_TEMP/pr.diff"

      - name: Run Claude deep analysis
        if: env.PEREGRINE_RUNNER == 'claude'
        working-directory: peregrine
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          PR_TITLE="$(jq -r '.title // ""' "$RUNNER_TEMP/pr.json")"
          PR_BODY="$(jq -r '.body // ""' "$RUNNER_TEMP/pr.json")"
          export PR_TITLE PR_BODY
          npm run review -- \
            --runner claude \
            --repo "$GITHUB_WORKSPACE/target" \
            --diff "$RUNNER_TEMP/pr.diff" \
            --base 'origin/${{ steps.pr.outputs.base_ref }}' \
            --head '${{ steps.pr.outputs.head_sha }}' \
            --output "$RUNNER_TEMP/result.json" \
            --deep

      - name: Run Codex deep analysis
        if: env.PEREGRINE_RUNNER == 'codex'
        working-directory: peregrine
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          PR_TITLE="$(jq -r '.title // ""' "$RUNNER_TEMP/pr.json")"
          PR_BODY="$(jq -r '.body // ""' "$RUNNER_TEMP/pr.json")"
          export PR_TITLE PR_BODY
          npm run review -- \
            --runner codex \
            --repo "$GITHUB_WORKSPACE/target" \
            --diff "$RUNNER_TEMP/pr.diff" \
            --base 'origin/${{ steps.pr.outputs.base_ref }}' \
            --head '${{ steps.pr.outputs.head_sha }}' \
            --output "$RUNNER_TEMP/result.json" \
            --deep

      - uses: actions/upload-artifact@v4
        with:
          name: peregrine-deep-review-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/result.json
            ${{ runner.temp }}/pr.diff
          if-no-files-found: error
          retention-days: 1

  post:
    needs: deep-review
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Peregrine
        uses: actions/checkout@v4
        with:
          repository: PeterGrayCreative/peregrine-bugbot
          path: peregrine
          token: ${{ secrets.PEREGRINE_CHECKOUT_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: ./peregrine/.github/actions/setup-peregrine
        with:
          install-runner: "false"

      - uses: actions/download-artifact@v4
        with:
          name: peregrine-deep-review-${{ github.run_id }}
          path: artifact

      - name: Revalidate and post against the current head
        working-directory: peregrine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_OWNER: ${{ github.repository_owner }}
          PR_REPO: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.issue.number }}
          PR_HEAD_SHA: ${{ needs.deep-review.outputs.head_sha }}
        run: |
          npm run post -- \
            --result "$GITHUB_WORKSPACE/artifact/result.json" \
            --diff "$GITHUB_WORKSPACE/artifact/pr.diff"
