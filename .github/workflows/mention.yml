# On-demand deep review: comment "@peregrine-bugbot" on a PR.
# Gated to repo members so outsiders can't burn the API budget. Note the gate
# covers the COMMENTER; the PR author (and thus title/body/diff) can be anyone,
# so all PR content stays treated as untrusted data:
#  - title/body are read from the PR JSON inside the run step (env assignment,
#    never GITHUB_OUTPUT heredocs — a body containing a delimiter line could
#    otherwise inject output values)
#  - the engine fences them as data in the prompt
name: peregrine-mention

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  deep-review:
    if: >
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@peregrine-bugbot') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve PR refs
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/pulls/${{ github.event.issue.number }}" > "$RUNNER_TEMP/pr.json"
          # head SHA is hex and base ref is a git refname — neither can contain
          # newlines, so single-line outputs are injection-safe.
          echo "head_sha=$(jq -r .head.sha "$RUNNER_TEMP/pr.json")" >> "$GITHUB_OUTPUT"
          echo "base_ref=$(jq -r .base.ref "$RUNNER_TEMP/pr.json")" >> "$GITHUB_OUTPUT"

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0

      - name: Checkout peregrine-bugbot
        uses: actions/checkout@v4
        with:
          repository: PeterGrayCreative/peregrine-bugbot
          path: .peregrine-bot
          token: ${{ secrets.PEREGRINE_CHECKOUT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup (skill, ripgrep, Node, CLI, deps)
        uses: ./.peregrine-bot/.github/actions/setup-peregrine
        with:
          checkout-token: ${{ secrets.PEREGRINE_CHECKOUT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Generate diff (size gate + inline-comment partition)
        run: |
          git fetch -q origin "${{ steps.pr.outputs.base_ref }}"
          git diff "origin/${{ steps.pr.outputs.base_ref }}...HEAD" > "$RUNNER_TEMP/pr.diff"

      - name: Run deep review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_OWNER: ${{ github.repository_owner }}
          PR_REPO: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.issue.number }}
          PR_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          PR_TITLE="$(jq -r '.title // ""' "$RUNNER_TEMP/pr.json")"
          PR_BODY="$(jq -r '.body // ""' "$RUNNER_TEMP/pr.json")"
          export PR_TITLE PR_BODY
          cd .peregrine-bot
          npx tsx src/index.ts review \
            --repo "$GITHUB_WORKSPACE" \
            --diff "$RUNNER_TEMP/pr.diff" \
            --base "origin/${{ steps.pr.outputs.base_ref }}" \
            --head "${{ steps.pr.outputs.head_sha }}" \
            --config peregrine.config.json \
            --deep --post
