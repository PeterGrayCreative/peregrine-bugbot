# Automatic review on ready-for-review PRs (and pushes to them).
# Also callable from other repos as a reusable workflow — that's the org
# rollout path: repos add a 5-line caller workflow, this stays the source of truth.
name: peregrine-review

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]
  workflow_call:
    secrets:
      ANTHROPIC_API_KEY:
        required: true

# Re-pushes cancel the superseded run — you pay for at most one review per
# push burst, and only the latest code gets reviewed.
concurrency:
  group: peregrine-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # Drafts are skipped; the synchronize event still fires for them.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout peregrine-bugbot
        uses: actions/checkout@v4
        with:
          repository: PeterGrayCreative/peregrine-bugbot
          path: .peregrine-bot
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install review skill
        uses: actions/checkout@v4
        with:
          repository: PeterGrayCreative/bugbot-codex-skills
          path: .claude/skills/bugbot-codex-skills
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .peregrine-bot/.nvmrc

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Install bot deps
        run: cd .peregrine-bot && npm ci

      - name: Generate diff
        run: |
          mkdir -p .peregrine
          git diff origin/${{ github.event.pull_request.base.ref }}...HEAD > .peregrine/pr.diff

      - name: Run review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_OWNER: ${{ github.repository_owner }}
          PR_REPO: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          cd .peregrine-bot
          npx tsx src/index.ts review \
            --repo "$GITHUB_WORKSPACE" \
            --diff "$GITHUB_WORKSPACE/.peregrine/pr.diff" \
            --config peregrine.config.json \
            --post

      - name: Cost summary
        if: always()
        run: |
          if [ -f .peregrine/result.json ]; then
            echo "### peregrine-bugbot run" >> "$GITHUB_STEP_SUMMARY"
            node -e "const r=require('./.peregrine/result.json'); console.log(\`- findings: \${r.findings.length}\n- cost: \$\${r.usage.costUsd ?? '?'}\n- duration: \${Math.round(r.durationMs/1000)}s\n- config: \${r.modelConfig}\`)" >> "$GITHUB_STEP_SUMMARY"
          fi
