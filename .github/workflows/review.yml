name: peregrine-review

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]
  workflow_call:
    inputs:
      runner:
        description: Review runner (claude or codex)
        required: false
        type: string
        default: claude
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false
      PEREGRINE_CHECKOUT_TOKEN:
        required: false

concurrency:
  group: peregrine-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PEREGRINE_RUNNER: ${{ inputs.runner || vars.PEREGRINE_RUNNER || 'claude' }}

jobs:
  analyze:
    if: >
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.fork == false
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout the immutable PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: target

      - name: Checkout Peregrine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PeterGrayCreative/peregrine-bugbot
          path: peregrine
          token: ${{ secrets.PEREGRINE_CHECKOUT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup selected runner
        uses: ./peregrine/.github/actions/setup-peregrine
        with:
          runner: ${{ env.PEREGRINE_RUNNER }}

      - name: Generate the review diff outside both checkouts
        run: |
          git -C target fetch -q origin '${{ github.event.pull_request.base.ref }}'
          git -C target diff 'origin/${{ github.event.pull_request.base.ref }}...${{ github.event.pull_request.head.sha }}' > "$RUNNER_TEMP/pr.diff"

      - name: Run Claude analysis
        if: env.PEREGRINE_RUNNER == 'claude'
        working-directory: peregrine
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          npm run review -- \
            --runner claude \
            --repo "$GITHUB_WORKSPACE/target" \
            --diff "$RUNNER_TEMP/pr.diff" \
            --base 'origin/${{ github.event.pull_request.base.ref }}' \
            --head '${{ github.event.pull_request.head.sha }}' \
            --output "$RUNNER_TEMP/result.json"

      - name: Run Codex analysis
        if: env.PEREGRINE_RUNNER == 'codex'
        working-directory: peregrine
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          npm run review -- \
            --runner codex \
            --repo "$GITHUB_WORKSPACE/target" \
            --diff "$RUNNER_TEMP/pr.diff" \
            --base 'origin/${{ github.event.pull_request.base.ref }}' \
            --head '${{ github.event.pull_request.head.sha }}' \
            --output "$RUNNER_TEMP/result.json"

      - name: Upload the validated review artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: peregrine-review-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/result.json
            ${{ runner.temp }}/pr.diff
          if-no-files-found: error
          retention-days: 1

  post:
    needs: analyze
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Peregrine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PeterGrayCreative/peregrine-bugbot
          path: peregrine
          token: ${{ secrets.PEREGRINE_CHECKOUT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup posting process without a model runner
        uses: ./peregrine/.github/actions/setup-peregrine
        with:
          install-runner: "false"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: peregrine-review-${{ github.run_id }}
          path: artifact

      - name: Revalidate and post against the current head
        working-directory: peregrine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_OWNER: ${{ github.repository_owner }}
          PR_REPO: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          npm run post -- \
            --result "$GITHUB_WORKSPACE/artifact/result.json" \
            --diff "$GITHUB_WORKSPACE/artifact/pr.diff"

      - name: Job summary
        if: always()
        run: |
          if [ -f artifact/result.json ]; then
            echo '### peregrine-bugbot run' >> "$GITHUB_STEP_SUMMARY"
            jq -r '
              def cost_source:
                if .engine == "mock" then "mock"
                elif .usage.costSource == "provider" then "provider-reported"
                elif .usage.costSource == "estimated" then "estimated"
                elif .usage.costSource == "mixed" then "mixed-source"
                else "unattributed"
                end;
              def cost:
                if .usage.costUsd == null then "n/a"
                else "\(cost_source) $\(.usage.costUsd)"
                end;
              "- status: \(.status)\n- runner: \(.engine)\n- findings: \(.findings | length)\n- cost: \(cost)\n- duration: \((.durationMs / 1000) | floor)s\n- config: \(.modelConfig)"
            ' artifact/result.json >> "$GITHUB_STEP_SUMMARY"
          fi
